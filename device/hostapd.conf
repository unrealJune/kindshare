# SoftAP on Kindle Voyage - AR6003 / ath6kl_sdio via nl80211.
#
# Capabilities taken from `iw phy phy0 info` on the device:
#   HT20 only (no HT40), Capabilities 0x20 => SHORT-GI-20, MCS 0-7 (single stream),
#   2.4GHz channels 1-11 enabled under regdomain 00.
interface=wlan0
driver=nl80211

ssid=kindrop
hw_mode=g
channel=6

# HT and WMM are OFF deliberately.
#
# hostapd's own log shows the driver refusing WMM configuration:
#     Failed to set TX queue parameters for queue 0..3
# yet the beacon was still advertising HT capabilities (2d 1a), HT operation
# (3d 16) and a WMM parameter element (dd 18 00 50 f2 02). Clients then
# associated as HT/WMM stations and the firmware dropped each one within
# seconds. Plain 802.11g asks this 2011 fullmac blob for nothing it has just
# told us it cannot do. Speed is irrelevant here - a book is a few MB.
ieee80211n=0
wmm_enabled=0

auth_algs=1
ignore_broadcast_ssid=0

# WPA2-PSK, and not for secrecy - for the authorization path.
#
# On an open BSS the hostapd log showed the driver being told authorized=0 at
# association and only reaching authorized=1 on a later re-association, after
# the client had already given up. The firmware accepted uplink frames (udhcpd
# logged DISCOVERs) but nothing we sent came back, which is what an unauthorized
# station looks like. WPA2 replaces that implicit path with an explicit 4-way
# handshake that ends in a definite authorize call.
#
# It is also diagnostic: EAPOL frames are downlink data to a not-yet-authorized
# station. If the handshake completes, the data path is fine and open-mode
# authorization was the bug. If EAPOL times out, the downlink is broken for
# everything and the problem is deeper than authorization.
# CCMP confirmed supported: nl80211 reported cipher 00-0f-ac:4.
wpa=2
wpa_passphrase=kindlevoyage
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# DTIM 1: buffered broadcast/multicast is delivered every beacon rather than
# every other one. Cheap insurance against a fullmac blob mishandling the
# buffered-frame path, which is how a broadcast DHCP OFFER would vanish.
dtim_period=1

# AR6003 AP mode tops out at a handful of stations.
max_num_sta=4

beacon_int=100

ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

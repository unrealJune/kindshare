#kate: syntax bash;
description "kindshare - Quick Share receiver for the Kindle"
author "kindler"

# volumd is what makes /mnt/us available; starting before it would find no
# binary to run. Mirrors how usbnet hooks itself in.
start on started volumd
stop on stopping volumd

pre-start script
    KINDLER_DIR="/mnt/us/kindler"
    BIN="${KINDLER_DIR}/bin/kindshare"
    ENABLE="${KINDLER_DIR}/autostart"
    LOG="/tmp/kindshare.log"

    # The toggle. The job itself is installed once (a root-filesystem write);
    # after that, enabling and disabling only creates or removes this flag file
    # on /mnt/us, so the UI never has to remount root read-write.
    [ -f "${ENABLE}" ] || exit 0
    [ -x "${BIN}" ] || exit 0

    # Never run two: a second copy cannot bind the port and dies silently,
    # leaving the device advertising with nothing listening.
    if pidof kindshare > /dev/null 2>&1 ; then
        exit 0
    fi

    # The Kindle's INPUT policy is DROP, so the advertised port has to be
    # opened explicitly or the phone's connection is dropped without a trace.
    iptables -C INPUT -p tcp --dport 12345 -j ACCEPT 2>/dev/null || \
        iptables -I INPUT 1 -p tcp --dport 12345 -j ACCEPT
    iptables -C INPUT -p udp --dport 5353 -j ACCEPT 2>/dev/null || \
        iptables -I INPUT 1 -p udp --dport 5353 -j ACCEPT

    mkdir -p /mnt/us/documents

    # No -name: the display name and id come from ${KINDLER_DIR}/identity so
    # the KOReader plugin's setting survives a reboot. Passing it here would
    # overwrite the user's choice every time the device came up.
    start-stop-daemon -S -b -m -p /tmp/kindshare.pid -x "${BIN}" -- \
        -daemon -iface wlan0 -port 12345 \
        -dest /mnt/us/documents

    # Don't ever hang the boot.
    exit 0
end script

post-stop script
    [ -f /tmp/kindshare.pid ] && kill "$(cat /tmp/kindshare.pid)" 2>/dev/null
    rm -f /tmp/kindshare.pid
    exit 0
end script
